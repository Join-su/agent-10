    assertions: [세 경로가 규칙대로 갈린다, 실패한 초안을 한 번 더 쓴다, 상한에서 오류를 단 채 멈춘다]
    app_link: 과제 10 App 의 `routing.py::decide_route` 가 같은 규칙(ESC-2·3·4·5·7)이고, ESC-5(조치 완료 뒤 24시간 안 재발)는 요청에 함께 온 조치 완료 기록으로 판단합니다. 되돌아가는 조건은 `review.py::after_validate`, 상한은 `review.py::MAX_ATTEMPTS`(2)입니다.

  - file: 10_parallel_collectors.ipynb
    project: task10_maintenance
    order: 10
    notebook_type: agent_technique
    new_concepts: [병렬 담당과 reducer 합치기]
    objective: 두 담당을 START 에서 함께 돌리고 reducer 로 결과를 모두 남긴 뒤 합치는 노드에서 중복을 지운다
    primitives: [practice_refused, practice_merged, practice_deduped]
    fixtures:
      success: reducer 를 주고 merge 에서 중복을 지운 경우
      failure: reducer 없이 두 담당이 같은 칸에 쓴 경우
    observe: [reducer 없을 때의 거부, 두 담당의 결과, 중복을 지운 근거]
    assertions: [reducer 없이는 거부된다, 두 담당의 결과가 모두 남는다, merge 가 중복을 지운다]
    app_link: 과제 10 App 의 `review.py::collect_manual` 과 `review.py::collect_history` 가 START 에서 함께 시작하고, 두 칸(`manual_found`, `history_found`)에 `operator.add` reducer 가 붙어 있습니다(`review.py::CaseState`). `review.py::merge` 가 같은 근거를 한 번만 남기고 판정 기준을 다시 계산합니다.

  - file: 11_review_pause.ipynb
    project: task10_maintenance
    order: 11
    notebook_type: agent_technique
    new_concepts: [검토 멈춤과 다시 묻기]
    objective: interrupt 로 검토 앞에서 멈추고 Command 로 이어 가며 받을 수 없는 결정은 다시 묻는다
    primitives: [practice_paused, practice_stuck, practice_reasked]
    fixtures:
      success: 다시 묻는 방식으로 escalate 까지 간 경우
      failure: 받을 수 없는 결정에 예외를 던져 굳은 경우
    observe: [멈춘 시점의 packet 과 다음 노드, 재개 뒤 앞 단계 실행 횟수, 예외 방식과 다시 묻기 방식의 차이]
    assertions: [실행이 실제로 끊긴다, 앞 단계는 다시 돌지 않는다, 예외 방식은 굳고 다시 묻기는 풀린다]
    app_link: 과제 10 App 의 `review.py::review` 가 같은 다시 묻기 방식으로 멈추고, `review.py::refusal` 이 받을 수 없는 결정의 이유를 만들며, `review.py::allowed_decisions` 가 검사 오류가 있으면 approve 를 뺍니다. `app.py::decide` 는 그래프에 닿기 전에 같은 목록으로 422 를 돌려줍니다. 저장소는 `shared/graph/checkpoint.py::thread_store` 가 고르고, `THREAD_DB` 를 주면 파일에 남아 재시작을 넘깁니다.

  - file: 12_end_to_end_evaluation.ipynb
    project: task10_maintenance
    order: 12
    notebook_type: agent_technique
    integration: true
    new_concepts: [ML 과 Agent 종단 평가]
    objective: 병렬 수집·경로·검토·보고서를 한 그래프로 잇고 경보가 없던 고장까지 넣어 시스템 재현율을 계산한다
    primitives: [practice_pipeline, evaluation_cases, practice_missed]
    fixtures:
      success: 경보 카드와 놓친 고장을 모두 넣은 평가
      failure: 경보로 온 카드만 본 Agent 재현율
    observe: [한 그래프의 흐름, 경로별 실제 고장과 오탐, Agent 재현율과 시스템 재현율]
    assertions: [두 카드가 보고서까지 간다, 경로별 수가 맞다, 시스템 재현율이 Agent 재현율보다 낮다]
    app_link: 과제 10 App 의 `evaluation.py::evaluate` 가 같은 평가를 실제 데이터로 합니다. 대표 사례 S01~S10 은 10건 모두 기대 경로대로 가고, 경보 카드 111장은 grounded_draft 75장(실제 고장 63) · escalation 17장(11) · inspect_only 19장(0)입니다. 운영 기간 실제 고장 99건 중 74건이 경보로 와서 **시스템 재현율은 74.7%** 이고, 놓친 25건 중 10건이 TWF 입니다. 경로는 `evaluation.py::route_for` 가 그래프와 같은 규칙으로 정하고, `GET /evaluate`(`app.py::evaluate`)가 이 결과를 돌려줍니다.
