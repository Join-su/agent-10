    app_link: 과제 10 App 의 `mcp_server.py::server` 가 `tools.py` 의 읽기 전용 목록에서 Tool 을 가져와 등록하고, 목록 밖 Tool 을 등록하려 하면 뜨지 않습니다. `MCP_MODE=on` 이면 `lookup.py::lookup_tools` 가 `shared/tools/mcp.py::mcp_tools` 로 이 서버를 자식 Process 로 띄워 Tool 을 받습니다. `lookup.py::succeeded` 가 결과 모양까지 보고 성공을 판단합니다.

  - file: 08_draft_chain.ipynb
    project: task10_maintenance
    order: 8
    notebook_type: agent_technique
    new_concepts: [초안 출력 파서와 인용 검증]
    objective: 프롬프트 | 모델 | PydanticOutputParser 로 초안을 받고 근거 목록 밖 인용과 단정 표현을 찾는다
    primitives: [practice_chain, practice_validate, practice_invented]
    fixtures:
      success: 근거 목록 안에서만 인용한 초안
      failure: 없는 절을 인용하고 원인을 단정한 초안, 형식이 깨진 출력
    observe: [체인의 타입, 검사 결과, 형식 오류]
    assertions: [좋은 초안은 오류가 없다, 지어낸 절과 단정 표현이 잡힌다, 형식이 깨진 출력은 파서에서 막힌다]
    app_link: 과제 10 App 의 `drafting.py::write_draft` 가 `PROMPT | model` 다음에 `drafting.py::PARSER`(PydanticOutputParser)로 초안을 받고, 형식 오류는 `DraftParseError` 로 바꿔 검사 실패로 돌립니다. 내용 검사는 `routing.py::validate_response` 가 맡고, 단정 표현 목록은 `routing.py::ASSERTIVE` 입니다. 검사는 이것 말고도 후보 순위·단계 번호가 1부터 이어지는지, 부품 번호가 근거에 있는지를 봅니다.

  - file: 09_route_and_retry.ipynb
    project: task10_maintenance
    order: 9
    notebook_type: agent_technique
    new_concepts: [규칙 경로 분기와 횟수 제한 재작성]
    objective: SOP 규칙으로 경로를 나누고 검사에 실패한 초안을 상한 안에서 다시 쓰게 한다
    primitives: [practice_route, practice_graph, practice_bounded]
    fixtures:
