    order: 7
    notebook_type: agent_technique
    new_concepts: [MCP 서버로 읽기 전용 Tool 열기]
    objective: FastMCP 서버가 읽기 전용 목록의 Tool 만 열고 MCP 를 거친 실패를 결과 모양으로 판단한다
