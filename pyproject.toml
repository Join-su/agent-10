[project]
name = "agent-10"
version = "0.1.0"
description = "캡스톤 과제 10 — 제조 설비 이상 대응 지원 Agent 실습 (앱 하나 + 기법 Notebook 12개)"
requires-python = ">=3.13"
# Phase 0 fixes the source of truth only. Retrieval, MCP and checkpoint
# packages arrive in the phase that first needs them, so Gate 0 keeps saying
# something precise about what is installable.
dependencies = [
  "pyyaml>=6.0,<7.0",
  # Phase 1 — Week 1 fixture app. Live(OpenAI·pgvector) 패키지는 Phase 4에서 추가한다.
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "streamlit>=1.57,<2.0",
  "langchain-core>=0.3,<2.0",
  "langchain-text-splitters>=1.0,<2.0",
  "rank-bm25>=0.2.2,<1.0",
  "mcp>=1.2,<2.0",
  "langgraph>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langchain-postgres>=0.0.16,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-dotenv>=1.0,<2.0",
  "langchain>=1.0,<2.0",
  "langchain-community>=0.3,<1.0",
  "faiss-cpu>=1.8,<2.0",
  "langchain-mcp-adapters>=0.3.2",
  "pypdf>=5.0,<7.0",
  "langgraph-checkpoint-postgres>=3.0,<4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "jupyterlab>=4.0,<5.0",
  "nbformat>=5.10,<6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# 정본 계약(tests/)과 과제 10 Test 를 한 명령으로 함께 돌린다.
testpaths = ["tests", "task10_maintenance"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
